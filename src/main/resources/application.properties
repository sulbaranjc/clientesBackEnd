spring.application.name=clientesBackEnd

# Puerto en el que arranca la API (http://localhost:8081)
server.port=8081

# Datos de conexion a MySQL (los lee la clase ConexionBD)
# La contrasena NO se guarda aqui: se lee de la variable de entorno DB_PASSWORD
db.url=jdbc:mysql://localhost:3306/clientes_db_fp01
db.usuario=${DB_USER}
db.password=${DB_PWD}